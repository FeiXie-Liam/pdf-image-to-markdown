[project]
name = "pdf-to-markdown"
version = "0.1.0"
description = "PDF教程文档转Markdown自动化工具"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "ollama>=0.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
pdf2md = "main:app"
