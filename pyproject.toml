[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-markdown"
version = "0.1.0"
description = "PDF教程文档转Markdown自动化工具，使用Ollama多模态模型进行OCR识别"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FeiXie-Liam", email = "xiefei0887@gmail.com"}
]
keywords = ["pdf", "markdown", "ocr", "ollama", "conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "ollama>=0.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
pdf2md = "pdf2md.cli:app"

[project.urls]
Homepage = "https://github.com/FeiXie-Liam/pdf-image-to-markdown"
Repository = "https://github.com/FeiXie-Liam/pdf-image-to-markdown"
Issues = "https://github.com/FeiXie-Liam/pdf-image-to-markdown/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md"]
